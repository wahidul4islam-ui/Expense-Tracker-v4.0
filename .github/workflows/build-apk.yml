name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip and prepare web files
        run: |
          mkdir -p tmp www
          unzip -q -o ./*.zip -d tmp
          SRC=$(dirname "$(find tmp -name index.html -not -path '*/__MACOSX/*' | head -1)")
          cp -r "$SRC"/. www/
          ls -la www

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Expense Tracker" com.hishab.expensetracker --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin duplicate class
        run: |
          cat >> android/app/build.gradle << 'EOF'

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF

      - name: Set taka app icon
        run: |
          RES=android/app/src/main/res
          find $RES -name 'ic_launcher.png' -exec cp www/icon-192.png {} \;
          find $RES -name 'ic_launcher_round.png' -exec cp www/icon-192.png {} \;
          find $RES -name 'ic_launcher_foreground.png' -exec cp www/icon-foreground.png {} \;
          sed -i 's/#FFFFFF/#0E8A63/I' $RES/values/ic_launcher_background.xml

      - name: Fixed key and version
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Expense-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
